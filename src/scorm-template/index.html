<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Swarm activity</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="status-bar" class="status-bar status-info" role="status" aria-live="polite">Starting learner session…</header>

    <div id="main-layout">
      <aside id="left-panel">
        <div id="instructions-panel" class="panel">
          <h2 id="activity-title">Swarm activity</h2>
          <div id="instructions-content" class="formatted-text">Loading instructions…</div>

          <div id="hint-panel" class="hints-inline" aria-live="polite">
            <h3>💡 Hints</h3>
            <div id="hint-list"><p class="hint-empty">Hints appear as you explore.</p></div>
            <button id="btn-request-hint" class="btn btn-secondary" type="button" hidden>Request a hint</button>
          </div>
        </div>
      </aside>

      <main id="workspace-area">
        <div class="simulator-wrapper">
          <iframe id="simulator-frame" title="Interactive micro:bit swarm simulation" src="about:blank"></iframe>
        </div>
        <div id="controls">
          <button id="btn-check" class="btn btn-primary" type="button" disabled>✓ Check</button>
          <button id="btn-reset-session" class="btn btn-secondary" type="button">Reset session</button>
        </div>
      </main>
    </div>
  </div>

  <dialog id="results-modal" class="results-modal-dialog" aria-labelledby="results-modal-title">
    <header class="results-modal-header">
      <h2 id="results-modal-title">Test results</h2>
      <button id="btn-close-results-modal" class="btn btn-secondary results-modal-close" type="button" aria-label="Close results" autofocus>✕</button>
    </header>
    <div class="results-modal-body">
      <p id="check-count" class="check-count">0 / 0</p>
      <div id="test-checklist" class="test-checklist"><p class="empty-note">Loading tests…</p></div>
      <p id="check-error" class="check-error" role="alert" hidden></p>
    </div>
  </dialog>

  <script defer src="js/app.bundle.js"></script>
</body>
</html>
