<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stub Swarm Simulator</title>
  <style>
    body { margin: 0; padding: 18px; color: #18352f; font: 14px Georgia, serif; }
    #simulator { display: grid; gap: 12px; }
    button { padding: 9px 12px; border: 1px solid #18352f; background: #d7e96d; color: #18352f; font: 700 12px monospace; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="simulator" aria-label="Stub learner simulator">
    <p id="simulator-status">Stub simulator waiting for activity settings.</p>
    <label><input id="stub-mode" type="checkbox" checked> Emit serial output for injected Alice A presses</label>
    <button id="button-a" type="button">Press Alice A</button>
  </main>
  <script>
    (() => {
      const source = 'swarm-sim-bridge';
      const now = '2026-05-16T04:20:00.000Z';
      const happyFrame = [
        0, 0, 0, 0, 0,
        0, 9, 0, 9, 0,
        0, 0, 0, 0, 0,
        9, 0, 0, 0, 9,
        0, 9, 9, 9, 0,
      ];
      const positions = {
        device: { alice: { x: 120, y: 140 }, bob: { x: 300, y: 200 } },
        source: { lamp: { x: 160, y: 160 } },
      };
      // A real SWARM v2 scene: the learner app merges authored geometry with the
      // live code assignments, so `get-bundle` must answer with a project.
      const pendingScene = encodeBundle({
        schemaVersion: 9,
        id: 'stub-scene',
        name: 'Stub scene',
        createdAt: now,
        updatedAt: now,
        viewOptions: { showRadioRange: true },
        devices: [
          { id: 'alice', name: 'Alice', position: positions.device.alice, programArtifactId: 'alice-code' },
          { id: 'bob', name: 'Bob', position: positions.device.bob, programArtifactId: 'bob-code' },
        ],
        artifacts: [
          codeArtifact('alice-code', 'stub-alice.hex', 'print("alice")'),
          codeArtifact('bob-code', 'stub-bob.hex', 'print("bob")'),
        ],
        environmentSources: [],
      });
      let sequence = 0;
      let capabilities = {};
      let uiVisibility = {};
      let currentBundle = pendingScene;
      let currentDisplay = new Array(25).fill(0);
      let replayed = false;

      function codeArtifact(id, name, mainPy) {
        return {
          id,
          name,
          artifactKind: 'hex',
          runtimeSource: 'micropython',
          program: {
            runtimeSource: 'micropython',
            filesystemBase64: { 'main.py': btoa(mainPy) },
          },
          createdAt: now,
        };
      }

      function encodeBundle(project) {
        const payload = new TextEncoder().encode(JSON.stringify(project));
        const bytes = new Uint8Array(7 + payload.length);
        bytes.set([0x53, 0x57, 0x41, 0x52, 0x4d, 0x02, 0x00], 0);
        bytes.set(payload, 7);
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      /** Device ids that carry code: the host waits for each to restart. */
      async function programmedDeviceIds(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        let payload = bytes.subarray(7);
        if (bytes[6] === 1) {
          const stream = new Blob([payload]).stream().pipeThrough(new DecompressionStream('gzip'));
          payload = new Uint8Array(await new Response(stream).arrayBuffer());
        }
        const project = JSON.parse(new TextDecoder().decode(payload));
        return (project.devices || [])
          .filter((device) => typeof device.programArtifactId === 'string')
          .map((device) => device.id);
      }

      /**
       * The real simulator restarts every device that carries code after a scene
       * load and reports it, which is the per-test isolation boundary.
       */
      async function announceRestart(base64) {
        let deviceIds = [];
        try {
          deviceIds = await programmedDeviceIds(base64);
        } catch {
          deviceIds = [];
        }
        for (const deviceId of deviceIds) {
          emit({ kind: 'code-restart', device_id: deviceId });
        }
      }

      function send(type, payload, id) {
        window.parent.postMessage({
          source,
          v: 1,
          type,
          ...(id === undefined ? {} : { id }),
          ...(payload === undefined ? {} : { payload }),
        }, location.origin);
      }

      function emit(event) {
        sequence += 1;
        send('event', { seq: sequence, ts: Date.now(), event });
      }

      function emitRadioReception(fromDeviceId, packet) {
        emit({ kind: 'radio-rx', device_id: 'bob', from_device_id: fromDeviceId, packet, rssi: -42 });
      }

      function receiveButton({ device_id, button }) {
        if (device_id !== 'alice' || button !== 'A') return;
        setTimeout(() => {
          if (document.getElementById('stub-mode').checked) {
            emit({ kind: 'serial', device_id: 'alice', text: 'button a' });
          }
          currentDisplay = happyFrame.slice();
          emit({ kind: 'display', device_id: 'alice', pixels: currentDisplay.slice() });
          emitRadioReception('alice', {
            data_b64: 'cGluZw==', group: 42, channel: 7, signal_strength: null,
          });
          emit({ kind: 'button', device_id: 'alice', button: 'A', pressed: true });
        }, 30);
      }

      window.addEventListener('message', (messageEvent) => {
        if (messageEvent.source !== window.parent || messageEvent.origin !== location.origin) return;
        const message = messageEvent.data;
        if (!message || message.source !== 'swarm-scorm' || message.v !== 1) return;
        const payload = message.payload || {};
        if (message.type === 'set-capabilities') {
          capabilities = payload;
          document.getElementById('button-a').hidden = capabilities.use_buttons === false;
          document.getElementById('simulator-status').textContent = 'Stub simulator ready in learner mode.';
          if (!replayed) {
            replayed = true;
            setTimeout(() => emit({ kind: 'serial', device_id: 'alice', text: 'hello 42' }), 40);
            setTimeout(() => emitRadioReception('alice', {
              data_b64: 'cGluZw==', group: 42, channel: 7, signal_strength: null,
            }), 80);
          }
        } else if (message.type === 'set-ui-visibility') {
          uiVisibility = payload;
          const enabled = Object.entries(uiVisibility)
            .filter(([, visible]) => visible === true)
            .map(([key]) => key);
          document.getElementById('simulator-status').textContent = `panels: ${enabled.join(',')}`;
        } else if (message.type === 'press-button') {
          receiveButton(payload);
          send('ack', {}, message.id);
        } else if (message.type === 'radio-broadcast') {
          const packet = {
            data_b64: payload.payload_b64,
            group: payload.group,
            channel: payload.channel,
            signal_strength: null,
          };
          emit({ kind: 'radio-tx', device_id: payload.device_id, packet });
          emitRadioReception(payload.device_id, packet);
          send('ack', {}, message.id);
        } else if (message.type === 'set-node-level') {
          document.getElementById('simulator-status').textContent = `node ${payload.node_id} level ${payload.value}`;
          send('ack', {}, message.id);
        } else if (message.type === 'move-node') {
          if (!positions.source[payload.node_id]) {
            send('error', { message: `Unknown environment node: ${payload.node_id}` }, message.id);
            return;
          }
          positions.source[payload.node_id] = { x: payload.x, y: payload.y };
          document.getElementById('simulator-status').textContent =
            `moved ${payload.node_id} to ${payload.x},${payload.y}`;
          send('ack', {}, message.id);
        } else if (message.type === 'add-node') {
          document.getElementById('simulator-status').textContent = `added ${payload.node_type} at ${payload.x},${payload.y}`;
          send('ack', {}, message.id);
        } else if (message.type === 'get-node-positions') {
          const nodes = payload.nodes || [];
          send('node-positions', {
            positions: nodes.flatMap((node) => {
              const position = (positions[node.kind] || {})[node.id];
              return position ? [{ kind: node.kind, id: node.id, x: position.x, y: position.y }] : [];
            }),
          }, message.id);
        } else if (message.type === 'get-display') {
          send('display', { displays: { alice: currentDisplay.slice() } }, message.id);
        } else if (message.type === 'get-bundle') {
          send('bundle', currentBundle, message.id);
        } else if (message.type === 'load-bundle') {
          currentBundle = message.payload;
          send('bundle', currentBundle, message.id);
          document.getElementById('simulator-status').textContent =
            `bundle loaded: ${String(currentBundle).length} chars`;
          emit({ kind: 'code-load', device_id: 'alice' });
          void announceRestart(currentBundle);
        } else if (message.type === 'reset') {
          document.getElementById('simulator-status').textContent = 'Stub simulator session reset.';
        }
      });

      document.getElementById('button-a').addEventListener('click', () => {
        emit({ kind: 'button', device_id: 'alice', button: 'A', pressed: true });
      });
      send('ready', {});
    })();
  </script>
</body>
</html>
