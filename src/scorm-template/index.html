<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Swarm activity</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section class="instruction-strip">
      <article id="instructions-panel" class="instruction-panel">
        <p class="eyebrow">Your mission</p>
        <div id="instructions-content" class="formatted-text">Loading instructions…</div>
      </article>
      <aside id="hint-panel" class="hint-panel" aria-live="polite">
        <div class="panel-title-row"><div><p class="eyebrow">Scaffolding</p><h2>Hints</h2></div><span id="hint-count" class="count-badge">0</span></div>
        <div id="hint-list"><p class="hint-empty">Hints appear as you explore.</p></div>
        <button id="btn-request-hint" class="btn btn-secondary" type="button" hidden>Request a hint</button>
      </aside>
    </section>

    <main class="activity-layout">
      <section class="simulator-panel" aria-label="Swarm simulation">
        <iframe id="simulator-frame" title="Interactive micro:bit swarm simulation" src="about:blank"></iframe>
      </section>
      <aside class="checklist-panel" aria-label="Test checklist">
        <div class="panel-title-row"><div><p class="eyebrow">Evidence to collect</p><h2>Test checklist</h2></div><span id="check-count" class="count-badge">0 / 0</span></div>
        <div id="test-checklist" class="test-checklist"><p class="empty-note">Loading tests…</p></div>
        <div class="checklist-actions">
          <button id="btn-reset-session" class="btn btn-secondary" type="button">Reset session</button>
          <button id="btn-check" class="btn btn-primary" type="button">Check</button>
        </div>
        <div id="status-bar" class="status-bar status-info" role="status" aria-live="polite">Starting learner session…</div>
      </aside>
    </main>
  </div>
  <script defer src="js/app.bundle.js"></script>
</body>
</html>
